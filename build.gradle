plugins {
	id "se.bjurr.gradle.bundle-jar" version "2.2.1"
}

javaExtension {
	javaVersion = 17
}

dependencies {
	api "se.bjurr.violations:violation-comments-lib:1.111.0"
	api "org.gitlab4j:gitlab4j-api:6.3.0"

	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testImplementation "org.assertj:assertj-core:3.27.7"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
}
